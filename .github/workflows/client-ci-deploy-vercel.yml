name: Client CI (No Deploy)

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "workflows/event-microinsurance/**"
      - "workflows/project.yaml"
      - ".github/workflows/client-ci-deploy-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-only placeholders for required server config.
      POLICY_RECEIVER: "0xF0e47056A1ab670F11Ae066F1661952f5ae35d1d"
      RELAY_PRIVATE_KEY: "0x1111111111111111111111111111111111111111111111111111111111111111"
      QUOTE_SIGNER_PK: "0x2222222222222222222222222222222222222222222222222222222222222222"
      EVENTBRITE_API_TOKEN: "ci-placeholder-token"
      X402_PAY_TO: "0x0000000000000000000000000000000000000001"
      # Use non-Coinbase URL in CI build so CDP keys are not required.
      X402_FACILITATOR_URL: "https://example.com/x402"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
