name: Client CI (No Deploy)

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "workflows/event-microinsurance/**"
      - "workflows/project.yaml"
      - ".github/workflows/client-ci-deploy-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CRE_EXECUTION_MODE: "simulate"
      X402_PAY_TO: "0x0000000000000000000000000000000000000001"
      # Use non-Coinbase URL in CI build so CDP keys are not required.
      X402_FACILITATOR_URL: "https://example.com/x402"
      CRE_LOCAL_PROJECT_ROOT: "./.cre/workflows"
      CRE_LOCAL_WORKFLOW_PATH: "./event-microinsurance"
      CRE_LOCAL_ENV_FROM_PROCESS: "true"
      CRE_LOCAL_CLI_BIN: "./.cre/bin/cre"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Stage CRE workflow assets
        run: npm run prepare:cre:sim-assets

      - name: Build
        run: npm run build
